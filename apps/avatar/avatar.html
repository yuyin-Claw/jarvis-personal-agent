<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: -apple-system, "SF Mono", monospace;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  #stage { width: 100%; height: 100%; display: block; }
  #caption {
    position: absolute; bottom: 6px; width: 100%; text-align: center;
    color: rgba(120, 220, 255, 0.9); font-size: 11px; letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(60, 180, 255, 0.6);
    opacity: 0; transition: opacity 0.4s;
    pointer-events: none;
  }
  #caption.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption"></div>
<script>
"use strict";
// JARVIS 全息形象渲染器：消费 AestheticState（状态+强度），粒子系统表现六状态
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const captionEl = document.getElementById("caption");

let W = 0, H = 0, CX = 0, CY = 0, R = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2; CY = H / 2 - 6; R = Math.min(W, H) * 0.32;
}
window.addEventListener("resize", resize);
resize();

// ---- 状态（由宿主 postMessage 或 IPC 驱动） ----
let state = "idle";
let intensity = 0.15;
let caption = "";
let stateAt = performance.now();

const PALETTE = {
  idle:      { r: 70,  g: 160, b: 255, glow: 0.35 },
  listening: { r: 90,  g: 220, b: 180, glow: 0.55 },
  thinking:  { r: 160, g: 120, b: 255, glow: 0.6  },
  speaking:  { r: 120, g: 210, b: 255, glow: 0.8  },
  working:   { r: 255, g: 170, b: 70,  glow: 0.65 },
  responding:{ r: 140, g: 255, b: 170, glow: 0.9  },
};
function color(alpha) {
  const p = PALETTE[state] || PALETTE.idle;
  return `rgba(${p.r},${p.g},${p.b},${alpha})`;
}

// ---- 粒子系统 ----
const N = 160;
const particles = [];
for (let i = 0; i < N; i++) {
  particles.push({
    a: Math.random() * Math.PI * 2,        // 角度
    r0: 0.55 + Math.random() * 0.45,       // 轨道半径系数
    speed: 0.2 + Math.random() * 0.8,      // 角速度
    size: 0.8 + Math.random() * 1.8,
    phase: Math.random() * Math.PI * 2,    // 呼吸相位
    wander: Math.random() * Math.PI * 2,
  });
}

// 音频幅度（speaking/listening 时由宿主推送 0-1）
let amplitude = 0;

function waveRadius(t, i) {
  // 各状态的核心轮廓
  const p = particles[i];
  switch (state) {
    case "idle": return R * (0.85 + 0.05 * Math.sin(t * 0.0012 + p.phase)); // 呼吸球
    case "listening": return R * (0.8 - 0.25 * intensity * (0.5 + 0.5 * Math.sin(p.a * 3 + t * 0.004))); // 收束
    case "thinking": return R * (0.7 + 0.18 * Math.sin(p.a * 2 - t * 0.005)); // 旋涡
    case "speaking": return R * (0.8 + 0.35 * amplitude * Math.sin(p.a * 5 + t * 0.012) + 0.1 * Math.sin(p.a + t * 0.003)); // 波动扩散
    case "working": return R * (0.75 + 0.15 * Math.sin(t * 0.006 + p.phase)); // 脉冲
    case "responding": return R * (0.9 + 0.12 * Math.sin(t * 0.008 + p.a)); // 高亮绽放
    default: return R * 0.85;
  }
}

let frame = 0;
function draw(t) {
  frame++;
  ctx.clearRect(0, 0, W, H);
  const since = t - stateAt;
  const settle = Math.min(1, since / 600); // 状态切换过渡

  // 光晕（核心 glow）
  const p = PALETTE[state] || PALETTE.idle;
  const glowR = R * (1.15 + 0.1 * Math.sin(t * 0.001));
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
  grad.addColorStop(0, `rgba(${p.r},${p.g},${p.b},${0.28 * p.glow * (0.6 + 0.4 * intensity)})`);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(CX, CY, glowR, 0, Math.PI * 2); ctx.fill();

  // 粒子
  for (let i = 0; i < N; i++) {
    const pt = particles[i];
    pt.a += pt.speed * 0.002 * (state === "thinking" ? 2.4 : state === "working" ? 1.4 : 1);
    const rr = waveRadius(t, i) * pt.r0 * (0.6 + 0.4 * settle);
    const wobble = (state === "speaking" ? 4 * amplitude : 1.5) * Math.sin(t * 0.01 + pt.wander);
    const x = CX + Math.cos(pt.a) * (rr + wobble);
    const y = CY + Math.sin(pt.a) * (rr + wobble) * 0.92; // 略扁=更立体
    const alpha = (0.25 + 0.55 * pt.size / 2.6) * (0.5 + 0.5 * settle);
    ctx.fillStyle = color(alpha);
    ctx.beginPath();
    ctx.arc(x, y, pt.size * (0.8 + 0.4 * intensity), 0, Math.PI * 2);
    ctx.fill();
  }

  // thinking：旋转轨道环
  if (state === "thinking") {
    ctx.strokeStyle = color(0.3);
    ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      const tilt = t * 0.001 * (k % 2 ? 1 : -1) + k * 2;
      ctx.beginPath();
      ctx.ellipse(CX, CY, R * (1.05 + k * 0.12), R * (0.3 + k * 0.08), tilt, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // working：进度弧
  if (state === "working") {
    ctx.strokeStyle = color(0.85);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(CX, CY, R * 1.18, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.08, intensity));
    ctx.stroke();
  }

  // responding：一次性扩散冲击波
  if (state === "responding" && since < 1200) {
    const pr = since / 1200;
    ctx.strokeStyle = color(0.6 * (1 - pr));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CX, CY, R * (0.8 + pr * 1.6), 0, Math.PI * 2); ctx.stroke();
  }

  // idle 呼吸内芯
  if (state === "idle") {
    const b = 0.5 + 0.5 * Math.sin(t * 0.0012);
    ctx.fillStyle = color(0.25 + 0.2 * b);
    ctx.beginPath(); ctx.arc(CX, CY, R * 0.28 * (0.9 + 0.1 * b), 0, Math.PI * 2); ctx.fill();
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---- 宿主接口：window.jarvis 更新状态 ----
window.jarvis = {
  setState(s, i, cap) {
    if (PALETTE[s]) { state = s; stateAt = performance.now(); }
    if (typeof i === "number") intensity = Math.max(0, Math.min(1, i));
    if (cap !== undefined) {
      caption = cap;
      captionEl.textContent = cap;
      captionEl.classList.toggle("show", !!cap);
    }
  },
  setAmplitude(a) { amplitude = Math.max(0, Math.min(1, a)); },
  getState() { return { state, intensity, amplitude, caption }; },
  /** 渲染帧计数：宿主/验收脚本据此确认画面确实推进 */
  frame() { return frame; },
};
// 兼容别名：window.setAvatarState({state, intensity, amplitude, caption})
window.setAvatarState = (d) => {
  if (!d || typeof d !== "object") return;
  window.jarvis.setState(d.state, d.intensity, d.caption);
  if (typeof d.amplitude === "number") window.jarvis.setAmplitude(d.amplitude);
};

// 拖动窗口（宿主注入 webkit messageHandlers 或全屏拖区由 CSS -webkit-app-region 处理）
document.body.style.webkitAppRegion = "drag";
</script>
</body>
</html>
