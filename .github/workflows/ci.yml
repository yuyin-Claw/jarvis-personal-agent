name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (workspace 包产物，测试的 vite 解析依赖 dist 入口)
        run: pnpm run typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
